services:
  - type: web
    name: breathe-esg-ingestion-prototype
    runtime: python
    buildCommand: "cd backend && pip install -r requirements.txt && cd ../frontend && npm install && npm run build && cd ../backend && python manage.py collectstatic --noinput"
    startCommand: "cd backend && python manage.py migrate && python manage.py seed_demo && gunicorn esg_ingestion.wsgi --log-file -"
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: breathe-esg-db
          property: connectionString

databases:
  - name: breathe-esg-db
    plan: free
